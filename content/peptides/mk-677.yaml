    - title: Administration
      body: "Swallow once daily with water; food not required."
    - title: Timing
      body: "Commonly dosed before sleep; timing is a preference, not efficacy-critical."
    - title: Storage
      body: "Room temperature ≤25 °C, dry, out of light."
    - title: Monitoring
      body: "Track fasting glucose / HbA1c and signs of fluid retention with chronic use."

