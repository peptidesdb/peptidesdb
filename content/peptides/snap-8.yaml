summary: >-
  Synthetic 8-amino-acid peptide derived from the N-terminal region of SNAP-25, a component of the
  neuronal SNARE complex. Proposed to interfere with SNARE-mediated vesicular neurotransmitter
  release when applied topically; studied for effects on muscle contraction intensity and facial
  wrinkle depth. Marketed in topical cosmetic formulations as an alternative to injectable
  neuromodulators.
