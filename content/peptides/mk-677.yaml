mechanism:
  primary_target:
    value: "Ghrelin receptor (GHSR-1a)"
    cite: [liu-2021-ghsr]
  pathway:
    value: "Ghrelin-mimetic agonism of GHSR-1a on pituitary somatotrophs → pulsatile GH release → hepatic IGF-1 production"
    cite: [liu-2021-ghsr, svensson-2003-mk677]
  downstream_effect:
    value: "Sustained IGF-1 elevation, increased fat-free mass, increased appetite; GH secretory pattern stays pulsatile"
    cite: [nass-2008-mk677, murphy-1998-mk677]
  origin:
    value: "Small-molecule ghrelin-receptor agonist developed by Merck (MK-0677); orally bioavailable, non-peptide"
    cite: [philip-2022-ibutamoren]
  feedback_intact:
    value: "GH-axis feedback preserved — secretion remains pulsatile and subject to somatostatin, unlike exogenous GH"
    cite: [svensson-2003-mk677]
