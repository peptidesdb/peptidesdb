side_effects:
  rows:
    - parameter: "Increased appetite"
      value: { value: "Pronounced hunger increase (ghrelin-receptor effect) — the most consistent side effect", badge: yellow, cite: [sigalos-2018-ghs] }
      severity: mild
    - parameter: "Fluid retention / edema"
      value: { value: "Peripheral edema, transient joint aches (GH-axis effect)", badge: yellow, cite: [sigalos-2018-ghs] }
      severity: moderate
    - parameter: "Insulin sensitivity / glucose"
      value: { value: "Reduced insulin sensitivity and increased fasting glucose; monitor in metabolic risk", badge: yellow, cite: [sigalos-2018-ghs] }
      severity: moderate
    - parameter: "Cortisol"
      value: { value: "Modest cortisol elevation reported in the class", badge: yellow, cite: [sigalos-2018-ghs] }
      severity: mild
    - parameter: "Hepatotoxicity"
      value: { value: "Case report of drug-induced liver injury with unregulated use", badge: red, cite: [cobani-2025-mk677] }
      severity: severe
    - parameter: "No cognitive benefit"
      value: { value: "Raised IGF-1 but produced no cognitive benefit in an Alzheimer's RCT — IGF-1 elevation is not universally beneficial", badge: yellow, cite: [sevigny-2008-mk677] }
      severity: mild
  contraindications_absolute:
    - "Active malignancy (GH / IGF-1 axis stimulation)"
    - "Pregnancy / breastfeeding"
  contraindications_relative:
    - "Diabetes / impaired glucose tolerance (worsens insulin sensitivity)"
    - "Congestive heart failure or edema-prone states (fluid retention)"
    - "Untreated hepatic impairment"

administration:
  steps:
