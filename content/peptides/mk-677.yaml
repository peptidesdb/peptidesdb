# =========================================================
# MK-677 (Ibutamoren) — orally active GH secretagogue
# =========================================================
schema_version: 1
slug: mk-677
name: MK-677
peptide_class: Ghrelin Receptor Agonist (oral)
classification: Growth-hormone secretagogue · Ghrelin (GHSR-1a) receptor agonist
categories: [gh-axis, growth-hormone, secretagogue, oral, small-molecule]
aliases: ["Ibutamoren", "MK-0677", "Ibutamoren Mesylate", "L-163191"]
color: teal
